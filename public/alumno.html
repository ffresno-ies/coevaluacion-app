<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votación de Alumnos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-5 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="bg-emerald-600 text-white p-2.5 rounded-xl font-bold text-2xl">👨‍🎓</div>
      <div>
        <h1 class="font-extrabold text-xl md:text-2xl leading-tight">Portal de Coevaluación del Alumno</h1>
        <p id="subHeaderMode" class="text-sm text-slate-400">Puntuación Directa del 1 al 10</p>
      </div>
    </div>
    <span id="connectionBadge" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-sm font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> En Vivo
    </span>
  </header>

  <main class="flex-1 p-4 md:p-8 max-w-3xl mx-auto w-full flex items-center justify-center">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 md:p-8 shadow-2xl space-y-7 w-full">
      
      <div class="text-center space-y-1">
        <span class="inline-block px-3.5 py-1 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 mb-1">
          Exposición en Curso
        </span>
        <h2 id="studentActiveGroup" class="text-3xl md:text-4xl font-black text-white tracking-wide">Cargando...</h2>
        <p id="studentStatusText" class="text-base text-slate-300 mt-2">Selecciona tu nota del 1 al 10.</p>
      </div>

      <!-- Contenedor Dinámico de Votación -->
      <div id="votingPanel" class="opacity-40 pointer-events-none transition-all duration-300 space-y-7">
        
        <!-- MODO A: Sin Rúbrica (Votación directa 1 al 10) -->
        <div id="simpleVotingMode" class="space-y-4">
          <label class="block text-base font-bold text-slate-200 text-center">Selecciona tu nota directa para este grupo:</label>
          <div id="simpleScoreButtons" class="grid grid-cols-5 md:grid-cols-10 gap-2.5">
            <!-- Botones 1 al 10 simples -->
          </div>
        </div>

        <!-- MODO B: Con Rúbrica por Criterios -->
        <div id="rubricVotingMode" class="hidden space-y-6">
          <div id="criteriaContainer" class="space-y-6">
            <!-- Criterios dinámicos -->
          </div>
        </div>

        <!-- Pie con Nota Calculada / Botón Enviar -->
        <div class="bg-slate-900/95 border border-indigo-500/40 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4 shadow-xl">
          <div>
            <span class="text-sm font-semibold text-slate-300" id="scoreLabelText">Tu Puntuación Seleccionada:</span>
            <p id="liveCalculatedScore" class="text-3xl md:text-4xl font-black text-emerald-400 mt-0.5">- / 10</p>
          </div>
          <button id="submitVoteBtn" onclick="handleSendVote()" disabled class="bg-slate-700 text-slate-500 font-bold px-7 py-4 rounded-xl shadow-lg transition text-base md:text-lg">
            Enviar Voto
          </button>
        </div>
      </div>

      <div id="voteSuccessAlert" class="hidden bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-5 rounded-2xl text-base font-bold text-center animate-bounce">
        🎉 ¡Tu calificación ha sido registrada correctamente!
      </div>
    </div>
  </main>

  <script>
    let appData = { votingActive: false, activeGroupIndex: null, groups: [], rubricCriteria: [] };
    let simpleSelectedScore = null;
    let rubricScores = [];
    let socket = null;
    let voterId = localStorage.getItem('voter_id') || 'voter_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('voter_id', voterId);

    try {
      socket = io();
      socket.on('stateUpdate', (data) => {
        appData = data;
        renderStudentPanel();
      });
    } catch(e) {}

    function selectSimpleScore(val) {
      simpleSelectedScore = val;
      updateScoreUI();
    }

    function setRubricScore(criterionIndex, score) {
      rubricScores[criterionIndex] = score;
      updateScoreUI();
    }

    function updateScoreUI() {
      const isRubricActive = appData.rubricCriteria && appData.rubricCriteria.length > 0;
      const btn = document.getElementById('submitVoteBtn');

      if (isRubricActive) {
        const validScores = rubricScores.filter(s => s !== undefined && s !== null);
        if (validScores.length === appData.rubricCriteria.length && appData.rubricCriteria.length > 0) {
          const sum = validScores.reduce((a, b) => a + b, 0);
          const avg = (sum / validScores.length).toFixed(1);
          document.getElementById('liveCalculatedScore').textContent = `${avg} / 10`;
          btn.disabled = false;
          btn.className = "bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold px-7 py-4 rounded-xl shadow-lg shadow-indigo-600/30 transition text-base md:text-lg";
        } else {
          document.getElementById('liveCalculatedScore').textContent = `- / 10`;
          btn.disabled = true;
          btn.className = "bg-slate-700 text-slate-500 font-bold px-7 py-4 rounded-xl shadow-lg transition text-base md:text-lg";
        }
        renderRubricCriteria();
      } else {
        if (simpleSelectedScore !== null) {
          document.getElementById('liveCalculatedScore').textContent = `${simpleSelectedScore} / 10`;
          btn.disabled = false;
          btn.className = "bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold px-7 py-4 rounded-xl shadow-lg shadow-indigo-600/30 transition text-base md:text-lg";
        } else {
          document.getElementById('liveCalculatedScore').textContent = `- / 10`;
          btn.disabled = true;
          btn.className = "bg-slate-700 text-slate-500 font-bold px-7 py-4 rounded-xl shadow-lg transition text-base md:text-lg";
        }
        renderSimpleButtons();
      }
    }

    function handleSendVote() {
      const isRubricActive = appData.rubricCriteria && appData.rubricCriteria.length > 0;
      if (!socket) return;

      if (isRubricActive) {
        if (rubricScores.length !== appData.rubricCriteria.length) return;
        socket.emit('submitVote', { scores: rubricScores, voterId });
      } else {
        if (!simpleSelectedScore) return;
        socket.emit('submitVote', { score: simpleSelectedScore, voterId });
      }

      document.getElementById('voteSuccessAlert').classList.remove('hidden');
      setTimeout(() => {
        document.getElementById('voteSuccessAlert').classList.add('hidden');
      }, 3500);
    }

    function renderStudentPanel() {
      const activeGroup = appData.groups[appData.activeGroupIndex];
      const titleEl = document.getElementById('studentActiveGroup');
      const statusEl = document.getElementById('studentStatusText');
      const panelEl = document.getElementById('votingPanel');
      const isRubricActive = appData.rubricCriteria && appData.rubricCriteria.length > 0;

      document.getElementById('subHeaderMode').textContent = isRubricActive ? "Coevaluación por Criterios de Rúbrica" : "Puntuación Directa del 1 al 10";
      document.getElementById('scoreLabelText').textContent = isRubricActive ? "Nota Media Final Rúbrica:" : "Tu Puntuación Seleccionada:";

      if (isRubricActive) {
        document.getElementById('simpleVotingMode').classList.add('hidden');
        document.getElementById('rubricVotingMode').classList.remove('hidden');
      } else {
        document.getElementById('simpleVotingMode').classList.remove('hidden');
        document.getElementById('rubricVotingMode').classList.add('hidden');
      }

      if (activeGroup && appData.votingActive) {
        titleEl.textContent = activeGroup.name;
        statusEl.textContent = isRubricActive ? 'Valora cada criterio de 1 a 10 para enviar la rúbrica.' : 'Selecciona tu puntuación directa del 1 al 10.';
        panelEl.className = "space-y-7 opacity-100 pointer-events-auto transition-all duration-300";
      } else if (activeGroup && !appData.votingActive) {
        titleEl.textContent = activeGroup.name;
        statusEl.textContent = 'La votación se encuentra pausada por el profesor.';
        panelEl.className = "space-y-7 opacity-40 pointer-events-none transition-all duration-300";
      } else {
        titleEl.textContent = 'Esperando inicio...';
        statusEl.textContent = 'El profesor aún no ha seleccionado ningún grupo para exponer.';
        panelEl.className = "space-y-7 opacity-40 pointer-events-none transition-all duration-300";
      }

      updateScoreUI();
    }

    function renderSimpleButtons() {
      const container = document.getElementById('simpleScoreButtons');
      let btnsHTML = '';
      for (let i = 1; i <= 10; i++) {
        const isSelected = simpleSelectedScore === i;
        btnsHTML += `
          <button onclick="selectSimpleScore(${i})" class="h-14 rounded-2xl font-black text-lg md:text-xl transition-all border ${isSelected ? 'bg-indigo-600 text-white border-indigo-400 ring-4 ring-indigo-400/50 scale-105 shadow-xl' : 'bg-slate-900 text-slate-200 border-slate-700 hover:border-slate-500 hover:bg-slate-750'}">
            ${i}
          </button>
        `;
      }
      container.innerHTML = btnsHTML;
    }

    function renderRubricCriteria() {
      const container = document.getElementById('criteriaContainer');
      container.innerHTML = appData.rubricCriteria.map((criterion, cIdx) => {
        const selectedVal = rubricScores[cIdx];
        let buttonsHTML = '';
        for (let i = 1; i <= 10; i++) {
          const isSelected = selectedVal === i;
          buttonsHTML += `
            <button onclick="setRubricScore(${cIdx}, ${i})" class="h-11 rounded-xl font-bold text-sm md:text-base transition-all border ${isSelected ? 'bg-indigo-600 text-white border-indigo-400 ring-2 ring-indigo-400 scale-105 shadow-md' : 'bg-slate-900 text-slate-200 border-slate-700 hover:border-slate-500'}">
              ${i}
            </button>
          `;
        }

        return `
          <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-5 space-y-3 text-left shadow-md">
            <h4 class="text-sm md:text-base font-bold text-slate-100 flex items-center gap-2.5">
              <span class="bg-indigo-600/30 text-indigo-400 w-6 h-6 rounded-full flex items-center justify-center text-xs font-mono font-extrabold">${cIdx + 1}</span>
              ${criterion}
            </h4>
            <div class="grid grid-cols-5 md:grid-cols-10 gap-2">
              ${buttonsHTML}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
